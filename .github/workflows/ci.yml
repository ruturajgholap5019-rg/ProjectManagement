name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Backend End-to-End Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: mongodb://localhost:27017/test_db
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_32_characters_long_min
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_32_characters_long_min
        run: npm test

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
